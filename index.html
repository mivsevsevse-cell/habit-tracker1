<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер привычек</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            padding: 16px;
            min-height: 100vh;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .premium-badge {
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .habit-count {
            font-size: 13px;
            color: #888;
        }
        
        .add-habit-btn {
            width: 100%;
            padding: 14px;
            background: #2481cc;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        
        .add-habit-btn:active {
            transform: scale(0.97);
            opacity: 0.8;
        }
        
        .habit-card {
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }
        
        .habit-card.done {
            opacity: 0.7;
            background: #f0f8f0;
        }
        
        .habit-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .habit-icon {
            font-size: 28px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            border-radius: 10px;
            flex-shrink: 0;
        }
        
        .habit-name {
            font-size: 16px;
            font-weight: 600;
        }
        
        .habit-description {
            font-size: 13px;
            color: #888;
        }
        
        .habit-check {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #2481cc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            background: transparent;
            color: #2481cc;
        }
        
        .habit-check.done {
            background: #2481cc;
            border-color: #2481cc;
            color: white;
        }
        
        .habit-check:active {
            transform: scale(0.85);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }
        
        .empty-state p {
            font-size: 16px;
        }
        
        .empty-state .sub {
            font-size: 14px;
            margin-top: 8px;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px 16px 0 0;
            padding: 24px 20px 32px;
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-content h2 {
            margin-bottom: 4px;
            font-size: 20px;
        }
        
        .modal-content .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .modal-content label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .modal-content input,
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 16px;
            background: #f9f9f9;
            color: #1a1a1a;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        
        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: #2481cc;
        }
        
        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        
        .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal-actions button:active {
            transform: scale(0.97);
        }
        
        .modal-actions .cancel {
            background: #e0e0e0;
            color: #1a1a1a;
        }
        
        .modal-actions .save {
            background: #2481cc;
            color: white;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- ========== ОСНОВНОЙ КОНТЕНТ ========== -->
    <div id="app">
        <div class="header">
            <h1>📊 Привычки</h1>
            <div class="header-right">
                <span class="habit-count" id="habitCount">0 привычек</span>
                <span class="premium-badge">Бесплатно</span>
            </div>
        </div>
        
        <button class="add-habit-btn" id="addHabitBtn">➕ Добавить привычку</button>
        
        <div id="habitsList"></div>
        
        <div id="emptyState" class="empty-state">
            <span class="emoji">🌱</span>
            <p><strong>У тебя пока нет привычек</strong></p>
            <p class="sub">Добавь первую и начни меняться каждый день!</p>
        </div>
    </div>

    <!-- ========== МОДАЛЬНОЕ ОКНО ========== -->
    <div class="modal-overlay" id="habitModal">
        <div class="modal-content">
            <h2>➕ Новая привычка</h2>
            <p class="subtitle">Что ты хочешь улучшить в своей жизни?</p>
            
            <label>Название</label>
            <input type="text" id="habitName" placeholder="Например: Утренняя зарядка">
            
            <label>Иконка (эмодзи)</label>
            <input type="text" id="habitIcon" placeholder="Например: 💪" value="✅" maxlength="2">
            
            <label>Описание (необязательно)</label>
            <textarea id="habitDescription" placeholder="Краткое описание привычки..."></textarea>
            
            <div class="modal-actions">
                <button class="cancel" id="modalCancel">Отмена</button>
                <button class="save" id="modalSave">✅ Добавить</button>
            </div>
        </div>
    </div>

    <!-- ========== УВЕДОМЛЕНИЕ ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== СКРИПТЫ ========== -->
    <script>
        // =============================================
        // ===== СОСТОЯНИЕ ПРИЛОЖЕНИЯ =====
        // =============================================
        
        // Загружаем привычки из localStorage
        let habits = [
            { id: 1, name: 'Зарядка', icon: '💪', description: '15 минут утром', completed: false },
            { id: 2, name: 'Чтение', icon: '📚', description: '20 страниц', completed: false },
        ];
        let nextId = 3;
        
        // =============================================
        // ===== ОТРИСОВКА =====
        // =============================================
        
        function renderHabits() {
            const list = document.getElementById('habitsList');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('habitCount');
            
            // Обновляем счётчик
            const total = habits.length;
            count.textContent = `${total} привычек`;
            
            if (habits.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            list.innerHTML = habits.map(habit => `
                <div class="habit-card ${habit.completed ? 'done' : ''}" data-id="${habit.id}">
                    <div class="habit-info">
                        <div class="habit-icon">${habit.icon || '✅'}</div>
                        <div>
                            <div class="habit-name">${habit.name}</div>
                            ${habit.description ? `<div class="habit-description">${habit.description}</div>` : ''}
                        </div>
                    </div>
                    <div class="habit-check ${habit.completed ? 'done' : ''}" 
                         data-id="${habit.id}"
                         onclick="toggleHabit(${habit.id})">
                        ${habit.completed ? '✓' : ''}
                    </div>
                </div>
            `).join('');
        }
        
        // =============================================
        // ===== ДЕЙСТВИЯ =====
        // =============================================
        
        function toggleHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.completed = !habit.completed;
                renderHabits();
                showToast(habit.completed ? '✅ Отлично! Привычка выполнена!' : '↩️ Отметка снята');
            }
        }
        
        function addHabit(name, icon, description) {
            habits.push({
                id: nextId++,
                name: name.trim(),
                icon: icon.trim() || '✅',
                description: description.trim() || '',
                completed: false
            });
            renderHabits();
            closeModal();
            showToast('✅ Привычка добавлена!');
        }
        
        // =============================================
        // ===== МОДАЛЬНОЕ ОКНО =====
        // =============================================
        
        const modal = document.getElementById('habitModal');
        
        document.getElementById('addHabitBtn').addEventListener('click', () => {
            modal.classList.add('active');
            document.getElementById('habitName').focus();
        });
        
        document.getElementById('modalCancel').addEventListener('click', closeModal);
        document.getElementById('modalSave').addEventListener('click', () => {
            const name = document.getElementById('habitName').value;
            const icon = document.getElementById('habitIcon').value;
            const description = document.getElementById('habitDescription').value;
            
            if (!name.trim()) {
                showToast('⚠️ Введите название привычки');
                return;
            }
            
            addHabit(name, icon, description);
        });
        
        document.getElementById('habitName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('modalSave').click();
            }
        });
        
        function closeModal() {
            modal.classList.remove('active');
            document.getElementById('habitName').value = '';
            document.getElementById('habitIcon').value = '✅';
            document.getElementById('habitDescription').value = '';
        }
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        // =============================================
        // ===== УВЕДОМЛЕНИЯ =====
        // =============================================
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
        
        // =============================================
        // ===== ЗАПУСК =====
        // =============================================
        
        renderHabits();
        console.log('✅ Приложение загружено!');
        console.log('📊 Привычек:', habits.length);
        
        // Для Telegram WebApp
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                console.log('📱 Telegram WebApp инициализирован');
            }
        } catch (e) {
            console.log('ℹ️ Работаем вне Telegram');
        }
    </script>
</body>
</html>
